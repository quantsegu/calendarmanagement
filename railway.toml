[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/api/openapi"
startCommand = "npm run start"
# If DATABASE_URL isn't provided yet (e.g. while you're still configuring Railway variables),
# skip `prisma db push` so the deploy doesn't fail early.
preDeployCommand = ["sh -c 'if [ -n \"$DATABASE_URL\" ]; then npx prisma db push; else echo \"DATABASE_URL not set; skipping prisma db push\"; fi'"]
